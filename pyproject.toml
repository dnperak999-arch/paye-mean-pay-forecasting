[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paye-mean-pay-forecasting"
version = "0.1.0"
description = "Cross-sectional forecasting of UK PAYE mean pay (June 2025) using OLS, Ridge and baseline models, with clustering analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Daria" }
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest"
]

[tool.setuptools]
packages = []

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
